services:
  backend:
    build: .
    image: lubristock-backend:dev
    container_name: lubristock-backend
    ports:
      - "8000:8000"
      
    env_file:
      - .env
    # Run the built image without host bind mounts or reload watchers.
    # This keeps the container stable on Docker Desktop for Windows.
    restart: unless-stopped


